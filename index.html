<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root">
      <div style="font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 10px;">
        <div style="color: #666;">Loading Application...</div>
        <noscript>
          <div style="color: #e11d48; font-weight: bold;">JavaScript is required to run this application.</div>
        </noscript>
      </div>
    </div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var div = document.createElement('div');
        div.style.color = 'red';
        div.style.position = 'fixed';
        div.style.bottom = '0';
        div.style.left = '0';
        div.style.background = 'white';
        div.style.padding = '10px';
        div.style.fontSize = '12px';
        div.style.zIndex = '9999';
        div.innerText = 'Error: ' + msg + '\nAt: ' + url + ':' + line;
        document.body.appendChild(div);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
