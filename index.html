<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root">
      <div id="debug-loader" style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; color: #666;">
        Connecting to Stock Master...
      </div>
    </div>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;bottom:10px;left:10px;right:10px;background:#fee2e2;border:1px solid #ef4444;color:#991b1b;padding:12px;font-family:monospace;font-size:12px;z-index:9999;border-radius:4px;white-space:pre-wrap;';
        errDiv.textContent = 'Runtime Error: ' + msg + '\nSource: ' + url + ':' + line;
        document.body.appendChild(errDiv);
        var loader = document.getElementById('debug-loader');
        if (loader) loader.textContent = 'System Load Failure';
      };
      console.log('Stock Master Bootstrapping...');
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
